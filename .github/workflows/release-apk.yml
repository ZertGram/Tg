name: Build & Release Telegram APK

on:
  workflow_dispatch:           # ← Ручной запуск
    inputs:
      version:
        description: 'Версия релиза (например: 11.5.0 или 11.5.0-beta1)'
        required: true
        default: '11.5.0'
      prerelease:
        description: 'Это пре-релиз? (beta/rc)'
        required: false
        default: 'false'
        type: boolean

  push:
    tags:
      - 'v*'                   # Можно оставить на случай тегов

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Release APK
      run: |
        ./gradlew :TMessagesProj:assembleRelease --stacktrace

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ inputs.version }}
        name: Telegram Android v${{ inputs.version }}
        body: |
          **Версия:** v${{ inputs.version }}
          
          Сборка запущена вручную через GitHub Actions.
        draft: false
        prerelease: ${{ inputs.prerelease }}
        files: |
          TMessagesProj/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
