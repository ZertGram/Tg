name: Build Zertgram APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например: 1.0.1 или 11.5.0)'
        required: true
        default: '1.0.1'
      prerelease:
        description: 'Это пре-релиз (beta/rc)?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Free up disk space
        run: |
          echo "Cleaning up disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Zertgram Release
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace

      - name: Find and Rename APK
        run: |
          APK_FILE=$(find TMessagesProj_App/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            mv "$APK_FILE" Zertgram.apk
            echo "✅ APK successfully renamed to Zertgram.apk"
            ls -la Zertgram.apk
          else
            echo "❌ APK not found!"
            find TMessagesProj_App/build/outputs/apk -type f || true
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Zertgram v${{ inputs.version }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          files: Zertgram.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zertgram-APK
          path: Zertgram.apk
