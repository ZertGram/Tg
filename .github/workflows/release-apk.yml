name: Build & Release Telegram APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия (например: 1.0.0 или 11.5.0)'
        required: true
        default: '1.0.0'
      prerelease:
        description: 'Пре-релиз?'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # ← Важно для создания релизов

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Release APK
      run: |
        echo "Building Release APK..."
        ./gradlew :TMessagesProj:assembleRelease --stacktrace || echo "Release build failed, trying Debug..."
        ./gradlew :TMessagesProj:assembleDebug --stacktrace

    - name: Upload artifacts (always)
      uses: actions/upload-artifact@v4
      with:
        name: Telegram-APKs
        path: |
          TMessagesProj/build/outputs/apk/**/*.apk
        if-no-files-found: warn

    - name: Create Release (only if Release APK exists)
      if: success() && hashFiles('TMessagesProj/build/outputs/apk/release/*.apk') != ''
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ inputs.version }}
        name: Telegram Android v${{ inputs.version }}
        body: |
          Автоматическая сборка v${{ inputs.version }}
        draft: false
        prerelease: ${{ inputs.prerelease }}
        files: TMessagesProj/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
