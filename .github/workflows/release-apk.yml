name: Build & Release APK

on:
  push:
    tags:
      - 'v*'          # Триггерится только при создании тега v1.2.3

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

    - name: Build Release APK
      run: |
        ./gradlew :TMessagesProj:assembleRelease --stacktrace

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref }}
        name: Telegram Android v${{ env.VERSION }}
        body: |
          **Версия:** v${{ env.VERSION }}
          
          Автоматическая сборка через GitHub Actions.
          
          - APK (Release)
          - Полная история изменений: [Commits](https://github.com/\( {{ github.repository }}/compare/ \){{ github.event.before }}...${{ github.sha }})
        draft: false
        prerelease: false
        files: |
          TMessagesProj/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
